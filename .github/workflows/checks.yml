name: Checks

# Every check that works without a TV: syntax, node 8 compatibility, icons,
# configuration server, key presses and live apply in headless Chrome.
#
# The TV itself is not part of CI — the device check stays a separate step
# (tools/install.sh plus looking at the screen).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned by commit SHA: a moved tag would otherwise run foreign code with the token
      # of this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'

      - name: Provide Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          chrome-version: stable

      - name: Show node and Chrome versions
        run: |
          node --version
          google-chrome --version || chrome --version

      - name: Run the checks
        env:
          CHROME: /opt/hostedtoolcache/chrome/stable/x64/chrome
        run: |
          if [ ! -x "$CHROME" ]; then
            CHROME="$(command -v google-chrome || command -v chrome)"
            export CHROME
          fi
          echo "Chrome: $CHROME"
          tools/check-all.sh
