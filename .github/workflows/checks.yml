name: Checks

# Every check that works without a TV: syntax, node 8 compatibility, icons,
# configuration server, key presses and live apply in headless Chrome.
#
# The TV itself is not part of CI — the device check stays a separate step
# (tools/install.sh plus looking at the screen).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned by commit SHA: a moved tag would otherwise run foreign code with the token
      # of this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4.0.3
        with:
          node-version: '20'

      - name: Provide Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1.7.2
        with:
          chrome-version: stable

      - name: Show node and Chrome versions
        run: |
          node --version
          google-chrome --version || chrome --version

      - name: Run the checks
        env:
          CHROME: /opt/hostedtoolcache/chrome/stable/x64/chrome
        run: |
          if [ ! -x "$CHROME" ]; then
            CHROME="$(command -v google-chrome || command -v chrome)"
            export CHROME
          fi
          echo "Chrome: $CHROME"
          tools/check-all.sh
